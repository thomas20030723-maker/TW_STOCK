name: daily-screen
on:
  schedule:
    - cron: "40 6 * * 1-5"   # 台北 14:40（收盤後），週一到週五
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas numpy
      - name: 第一次執行先用訓練期調參
        run: '[ -f params.json ] || python tw_momentum.py'
      - run: python dashboard.py
      - run: python daytrade.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/ params.json params_dt.json report.csv grid_train.csv grid_daytrade.csv 2>/dev/null || true
          git commit -m "daily update $(date -u +%F)" || echo "no change"
          git push
